name: Update Playlist

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Download and merge playlists from sources
        run: python download_playlists.py

      - name: Clean playlist
        run: python clean_playlist.py

      - name: Replace
        run: mv playlist_clean.m3u playlist.m3u

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add playlist.m3u
          git commit -m "Auto update + clean" || echo "No changes"
          git push
